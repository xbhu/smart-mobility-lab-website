publications:
  title: Publications
  lead: >-
    Selected publications by thrust. Dr. Hu has published 92 journal articles (as of September 2026),
    including 17 in Transportation Research Parts A–E and 11 in IEEE Transactions. For the full list,
    see Google Scholar.
  note: Lab members are marked; * marks the corresponding author.
  scholar: https://scholar.google.com/citations?hl=en&user=-2GgVTMAAAAJ&view_op=list_works&sortby=pubdate

projects:
  title: Projects & Tools
  lead: >-
    Since 2013 our work has been funded by 43 projects, 35 of them external, totaling $22.6 million.
    Sponsors include USDOT, FHWA, the Department of Energy, PennDOT, Pennsylvania DEP, Colorado DOT,
    Missouri DOT, and the Autonomous Maintenance Technology pooled fund.
  tools_heading: Tools and data
  tools:
    - name: PennDOT road friction project
      url: http://penndot.mobilitypsu.com
      text: Project site for friction factor interpolation and forecasting.
    - name: PA DEP zero-emission vehicle dashboard
      url: https://dep.mobilitypsu.com
      text: Data and analysis for Pennsylvania's medium- and heavy-duty zero-emission vehicle program.
    - name: ATMA field dataset (USDOT SMART)
      url: https://rosap.ntl.bts.gov/view/dot/87547
      text: Field data from ATMA deployments in Colorado, Minnesota, Wisconsin, and Oklahoma.
    - name: Lab code on GitHub
      url: https://github.com/xbhu
      text: Code released with our papers.
    - name: Smart Mobility Research Atlas
      url: https://atlas.mobilitypsu.com
      text: Plain-language pages for selected papers, with code, slides, and video.

facilities:
  title: Facilities
  lead: >-
    Our algorithms are tested in three stages: co-simulation, a full-size autonomous vehicle, and a
    USDOT-designated proving ground.

news:
  title: News
  lead: Grants, awards, media coverage, visits, and lab milestones.
